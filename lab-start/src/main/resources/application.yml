spring:
  application:
    name: lab-plarform
  flyway:
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: true
  profiles:
    active: local
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: z15903750100
    publisher-confirm-type: correlated
    publisher-returns: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        # 暂时 1个 线程处理应该就够
        concurrency: 1
        max-concurrency: 3

# Knife4j
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: "default"
      paths-to-match: "/**"
      packages-to-scan: com.hengyu.lab # ????????????????
knife4j:
  enable: true
  setting:
    language: zh_cn

# --- MyBatis-Plus  ---
mybatis-plus:
  map-underscore-to-camel-case: true
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.hengyu.lab.**.infrastructure.po
  type-enums-package: com.hengyu.**.domain.**.constant
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id
# application.yml
lab:
  jwt:
    secret: ${LAB_JWT_SECRET}
    expiration: 30 #  (单位分钟)
    token-header: Authorization
    token-prefix: "Bearer "

minio:
  endpoint: http://10.33.9.41:9002
  access-key: admin
  secret-key: z15903750100
  bucket-name: lab-platform
