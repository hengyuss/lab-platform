spring:
  datasource:
    driver-class-name: org.h2.Driver
    # MODE=MySQL 模拟 MySQL 语法
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: false
    clean-on-validation-error: true # 加上这个更保险，遇到冲突自动重置
  sql:
    init:
      mode: always
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.hengyu.lab.**.infrastructure.po


lab:
  jwt:
    # 随便写一串乱码，但在生产环境要保密且足够长
    secret: ${LAB_JWT_SECRET:LocalDevSecretKeyOnlyForDebuggingDO_NOT_USE_IN_PROD}
    expiration: 30 #  (单位分钟)
    token-header: Authorization
    token-prefix: "Bearer "

minio:
  endpoint: http://localhost:9002
  access-key: admin
  secret-key: z15903750100
  bucket-name: lab-platform
